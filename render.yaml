# Render blueprint for the Faith Hill church platform.
#
# Creates: Django API (with Supabase Postgres + Supabase Storage) and the two
# static React sites. Apply with Render -> "New +" -> "Blueprint", then fill in
# the values marked sync: false in the dashboard.
#
# See DEPLOYMENT.md for the full walkthrough.

services:
  # ---------------------------------------------------------------------
  # Django API (public site + staff dashboard both talk to this)
  # ---------------------------------------------------------------------
  - type: web
    name: faith-hill-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "cd faithhill && gunicorn faithhill.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -"
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: faithhill-media
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: THROTTLE_LOGIN
        value: 10/min
      - key: THROTTLE_SUBMIT
        value: 30/hour

  # ---------------------------------------------------------------------
  # Public website (static React build)
  # ---------------------------------------------------------------------
  - type: web
    name: faith-hill-website
    runtime: static
    rootDir: frontend/faithhill
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA fallback: every route is client-side, so unknown paths serve index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        sync: false

  # ---------------------------------------------------------------------
  # Staff dashboard (static React build) — served from an unguessable path,
  # NOT from a guessable subdomain like "admin". The real lock is JWT auth
  # plus is_staff on every API call; this just avoids advertising the door.
  # ---------------------------------------------------------------------
  - type: web
    name: fh-staff-console
    runtime: static
    rootDir: frontend/dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        sync: false
